<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Заряд пристрою</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#eef2ff;--bg2:#e0f2fe;--card:rgba(255,255,255,.65);--border:rgba(255,255,255,.8);
  --fg:#0f172a;--muted:#64748b;--shadow:0 20px 60px rgba(30,41,59,.15);--track:#e2e8f0;
  --c1:#22c55e;--c2:#16a34a;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg1:#0b1020;--bg2:#10202e;--card:rgba(20,28,45,.65);--border:rgba(255,255,255,.08);--fg:#f1f5f9;--muted:#94a3b8;--shadow:0 20px 60px rgba(0,0,0,.5);--track:#1e293b}
}
:root[data-theme="dark"]{--bg1:#0b1020;--bg2:#10202e;--card:rgba(20,28,45,.65);--border:rgba(255,255,255,.08);--fg:#f1f5f9;--muted:#94a3b8;--shadow:0 20px 60px rgba(0,0,0,.5);--track:#1e293b}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--fg);
  background:radial-gradient(circle at 20% 10%,var(--bg2),transparent 55%),radial-gradient(circle at 85% 90%,var(--bg1),transparent 50%),var(--bg1);
  display:flex;align-items:center;justify-content:center;padding:20px;transition:background .4s,color .4s}
.card{width:min(100%,460px);background:var(--card);border:1px solid var(--border);border-radius:32px;
  box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:30px 24px;text-align:center}
h1{margin:0 0 22px;font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.battery{position:relative;width:min(78%,280px);height:130px;margin:0 auto 22px;border:6px solid var(--fg);border-radius:30px;padding:6px;opacity:.95}
.battery::after{content:"";position:absolute;right:-18px;top:50%;width:10px;height:44px;transform:translateY(-50%);background:var(--fg);border-radius:0 8px 8px 0}
.track{width:100%;height:100%;border-radius:18px;background:var(--track);overflow:hidden;position:relative}
.fill{height:100%;width:0;border-radius:18px;background:linear-gradient(90deg,var(--c1),var(--c2));transition:width .6s cubic-bezier(.2,.8,.2,1),background .4s;position:relative;overflow:hidden}
.charging .fill::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-100%);animation:shine 1.8s linear infinite}
@keyframes shine{to{transform:translateX(100%)}}
.bolt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:54px;opacity:0;transform:scale(.6);transition:.3s;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.charging .bolt{opacity:1;transform:scale(1);animation:pop 1.4s ease-in-out infinite}
@keyframes pop{50%{transform:scale(1.15)}}
.pct{font-size:clamp(64px,22vw,104px);font-weight:800;line-height:1;background:linear-gradient(135deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent;transition:.4s}
.chip{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:9px 18px;border-radius:999px;font-weight:700;font-size:18px;background:rgba(148,163,184,.18)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.charging .chip{background:rgba(34,197,94,.18);color:var(--c2)}
.charging .dot{background:var(--c1);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
.tile{padding:14px 10px;border-radius:20px;background:rgba(148,163,184,.14)}
.tile small{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
.tile b{font-size:18px}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:26px}
button{font:inherit;font-weight:600;font-size:15px;color:#fff;border:0;border-radius:16px;padding:12px 18px;cursor:pointer;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 8px 20px rgba(99,102,241,.35);transition:transform .15s,box-shadow .15s,filter .15s}
button:hover{transform:translateY(-2px);filter:brightness(1.08)}
button:active{transform:scale(.96);box-shadow:0 3px 8px rgba(99,102,241,.35)}
button.alt{background:linear-gradient(135deg,#0ea5e9,#06b6d4);box-shadow:0 8px 20px rgba(14,165,233,.35)}
button.alt2{background:linear-gradient(135deg,#f97316,#ec4899);box-shadow:0 8px 20px rgba(249,115,22,.35)}
.clock{font-size:clamp(36px,12vw,56px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em;line-height:1.1}
.date{color:var(--muted);font-size:15px;text-transform:capitalize;margin:4px 0 20px}
.log{list-style:none;margin:20px 0 0;padding:0;text-align:left;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.log li{padding:7px 12px;border-radius:12px;background:rgba(148,163,184,.12);margin-top:6px;animation:in .4s}
@keyframes in{from{opacity:0;transform:translateY(-6px)}}
.note{margin-top:16px;color:var(--muted);font-size:14px;min-height:1.2em}
</style>
</head>
<body>
<main class="card" id="card">
  <div class="clock" id="clock">--:--:--</div>
  <div class="date" id="date"></div>
  <h1>Заряд пристрою</h1>
  <div class="battery"><div class="track"><div class="fill" id="fill"></div></div><div class="bolt">⚡</div></div>
  <div class="pct" id="pct">--%</div>
  <div class="chip"><span class="dot"></span><span id="status">Завантаження…</span></div>
  <div class="tiles">
    <div class="tile"><small id="tl1">До повного заряду</small><b id="t1">—</b></div>
    <div class="tile"><small>Залишилось часу</small><b id="t2">—</b></div>
  </div>
  <div class="btns">
    <button id="bTheme">🌓 Тема</button>
    <button id="bFull" class="alt">⛶ На весь екран</button>
    <button id="bRef" class="alt2">🔄 Оновити</button>
  </div>
  <ul class="log" id="log"></ul>
  <div class="note" id="note"></div>
</main>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var root=document.documentElement,card=$('card'),batt=null;
  var lastP=null,lastC=null;
  function pad(n){return n<10?'0'+n:n}
  function stamp(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())}
  function tick(){
    $('clock').textContent=stamp();
    $('date').textContent=new Date().toLocaleDateString('uk-UA',{weekday:'long',day:'numeric',month:'long'});
  }
  tick();setInterval(tick,1000);
  function logChange(p,c){
    if(p===lastP&&c===lastC)return;
    lastP=p;lastC=c;
    var ul=$('log'),li=document.createElement('li');
    li.textContent=stamp()+' — '+p+'% · '+(c?'заряджання':'не заряджається');
    ul.insertBefore(li,ul.firstChild);
    while(ul.children.length>6)ul.removeChild(ul.lastChild);
  }

  try{var t=localStorage.getItem('theme');if(t)root.setAttribute('data-theme',t)}catch(e){}
  $('bTheme').onclick=function(){
    var dark=root.getAttribute('data-theme')?root.getAttribute('data-theme')==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
    var n=dark?'light':'dark';root.setAttribute('data-theme',n);
    try{localStorage.setItem('theme',n)}catch(e){}
  };
  $('bFull').onclick=function(){
    try{
      if(document.fullscreenElement)document.exitFullscreen();
      else root.requestFullscreen();
    }catch(e){$('note').textContent='Повний екран недоступний'}
  };
  $('bRef').onclick=function(){if(batt)render();else init()};

  function fmt(s){
    if(!isFinite(s)||s<=0)return '—';
    var h=Math.floor(s/3600),m=Math.round(s%3600/60);
    return (h?h+' г ':'')+m+' хв';
  }
  function render(){
    var p=Math.round(batt.level*100);
    logChange(p,batt.charging);
    $('pct').textContent=p+'%';
    $('fill').style.width=p+'%';
    var c1,c2;
    if(batt.charging){c1='#22c55e';c2='#06b6d4'}
    else if(p<=20){c1='#ef4444';c2='#f97316'}
    else if(p<=50){c1='#f59e0b';c2='#f97316'}
    else{c1='#22c55e';c2='#16a34a'}
    root.style.setProperty('--c1',c1);root.style.setProperty('--c2',c2);
    card.classList.toggle('charging',batt.charging);
    $('status').textContent=batt.charging?'Заряджання':'Не заряджається';
    $('t1').textContent=batt.charging?fmt(batt.chargingTime):'—';
    $('t2').textContent=batt.charging?'—':fmt(batt.dischargingTime);
    $('note').textContent=(!batt.charging&&p<=20)?'Низький заряд — час підключити зарядку 🔌':'';
  }
  function init(){
    if(!navigator.getBattery){
      $('status').textContent='Недоступно';
      $('note').textContent='Відкрий сторінку на телефоні Android або ПК у Chrome. На iPhone/Safari ця функція не працює.';
      return;
    }
    navigator.getBattery().then(function(b){
      batt=b;
      ['levelchange','chargingchange','chargingtimechange','dischargingtimechange'].forEach(function(e){b.addEventListener(e,render)});
      render();
    }).catch(function(){$('status').textContent='Немає доступу';});
  }
  init();
})();
</script>
</body>
</html>
